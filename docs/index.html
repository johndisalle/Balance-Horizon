<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balance Horizon — Legal & Support</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            background: #ffffff;
            border-radius: 16px;
            padding: 3rem;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            font-size: 1rem;
            color: #6e6e73;
            margin-bottom: 2rem;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .links a {
            display: block;
            padding: 0.875rem 1.25rem;
            background: #f5f5f7;
            border-radius: 10px;
            text-decoration: none;
            color: #1d1d1f;
            font-size: 1rem;
            font-weight: 500;
            transition: background 0.2s;
        }
        .links a:hover {
            background: #e8e8ed;
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.8125rem;
            color: #86868b;
        }
        .footer a {
            color: #0071e3;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Balance Horizon</h1>
        <p class="subtitle">Calendar-centric budgeting for iOS</p>
        <div class="links">
            <a href="privacy-policy">Privacy Policy</a>
            <a href="terms-of-service">Terms of Service</a>
            <a href="support">Help &amp; Support</a>
        </div>
        <p class="footer">
            Made by Ellasid &mdash; <a href="mailto:support@ellasid.com">support@ellasid.com</a>
        </p>
    </div>
</body>
</html>
